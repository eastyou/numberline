name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test numberline generation
        run: |
          python -m numberline --start -10 --end 10 --step 1 --blank-every 2 --lines 4 --pages 1 --title 数轴练习纸 -o numberline.html
          python -c "import pathlib; t = pathlib.Path('numberline.html').read_text(encoding='utf-8'); assert t.count('<svg') == 4; assert t.count('<text') == 44; assert 'A4 portrait' in t; assert '数轴练习纸' in t; print('smoke ok')"
