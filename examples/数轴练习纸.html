<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>数轴练习纸</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 7mm 4mm 9mm;
    background: #e2e8f0;
    color: #0f172a;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC",
      "Source Han Sans SC", sans-serif;
  }
  .toolbar {
    width: 210mm;
    max-width: 100%;
    margin: 0 auto 4mm;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    color: #334155;
    font-size: 13px;
  }
  .toolbar strong { font-size: 15px; letter-spacing: 1px; }
  .toolbar span { color: #64748b; font-size: 12px; }
  .sheet {
    width: 210mm;
    max-width: 100%;
    min-height: 297mm;
    margin: 0 auto 6mm;
    padding: 14mm 15mm 12mm;
    background: #fff;
    box-shadow: 0 6px 22px rgba(15, 23, 42, 0.14);
    display: flex;
    flex-direction: column;
  }
  .head { text-align: center; margin-bottom: 4mm; }
  .head h1 {
    margin: 0;
    font-size: 20pt;
    font-weight: 600;
    letter-spacing: 4pt;
  }
  .head .sub {
    margin: 1.8mm 0 0;
    font-size: 9.5pt;
    color: #475569;
    letter-spacing: 0.4pt;
  }
  .lines {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
  }
  .line { position: relative; padding: 1.5mm 0; }
  .line .no {
    position: absolute;
    left: -1mm;
    top: 1.5mm;
    font-size: 8pt;
    color: #94a3b8;
  }
  .line svg {
    display: block;
    width: 170mm;
    max-width: 100%;
    height: auto;
    margin: 0 auto;
  }
  .foot {
    margin-top: 3mm;
    padding-top: 2mm;
    border-top: 0.2mm solid #e2e8f0;
    display: flex;
    align-items: baseline;
    font-size: 8pt;
    color: #64748b;
  }
  .foot .page { margin-left: auto; }
  @media screen and (max-width: 640px) {
    body { padding: 4mm 3mm 6mm; }
    .sheet { padding: 8mm 6mm; min-height: 0; }
    .head h1 { font-size: 16pt; letter-spacing: 2pt; }
    .toolbar { flex-direction: column; gap: 2px; }
    .line .no { left: 0; }
  }
  @page { size: A4 portrait; margin: 0; }
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .sheet {
      width: 210mm;
      height: 297mm;
      min-height: 0;
      max-width: none;
      margin: 0;
      box-shadow: none;
      padding: 14mm 15mm 12mm;
      page-break-after: always;
      break-after: page;
      overflow: hidden;
    }
    .sheet:last-child { page-break-after: auto; break-after: auto; }
    .line svg { width: 170mm; max-width: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
