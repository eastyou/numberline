[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numberline"
version = "0.1.0"
description = "数轴练习纸：一键生成 A4 可打印的数轴读数与描点练习"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["number-line", "worksheet", "math", "teacher", "education", "print", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
numberline = "numberline.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/numberline"
Source = "https://github.com/eastyou/numberline"

[tool.setuptools]
packages = ["numberline"]
